[project]
name = "img2text"
version = "0.1.0"
description = "Image-to-text bridge for non-vision LLMs in Claude Code"
requires-python = ">=3.10"
dependencies = [
    "click>=8",
    "httpx>=0.27",
    "pyyaml>=6",
    "socksio>=1.0.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.20"]
mlx = [
    "mlx>=0.30",
    "mlx-lm>=0.30",
    "mlx-vlm>=0.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
mlx-cuda = [
    "mlx-cuda==0.30.0; sys_platform == 'linux'",
    "mlx==0.30.0; sys_platform == 'linux'",
    "mlx-lm==0.30.0; sys_platform == 'linux'",
    "mlx-vlm==0.3.0; sys_platform == 'linux'",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "nvidia-cuda-nvcc-cu12>=12.9.86",
    "nvidia-cuda-runtime-cu12>=12.9",
]
full = ["img2text[vllm]", "img2text[mlx]"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
img2text = "img2text.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/img2text"]

[tool.uv]
# Support both Linux x86_64 (for mlx-cuda) and macOS arm64 (for native MLX)
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
prerelease = "allow"
conflicts = [
  [
    { extra = "vllm" },
    { extra = "mlx-cuda" },
  ],
  [
    { extra = "full" },
    { extra = "mlx-cuda" },
  ],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
