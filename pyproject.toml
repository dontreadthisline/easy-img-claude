[project]
name = "img2text"
version = "0.1.0"
description = "Image-to-text bridge for non-vision LLMs in Claude Code"
requires-python = ">=3.10"
dependencies = ["click>=8", "httpx>=0.27", "pyyaml>=6", "socksio>=1.0.0"]

[project.optional-dependencies]
# vLLM backend - Linux only
vllm = ["vllm>=0.20; sys_platform == 'linux'"]
# MLX backend - macOS only
mlx = [
  "mlx>=0.30; sys_platform == 'darwin'",
  "mlx-lm>=0.30; sys_platform == 'darwin'",
  "mlx-vlm>=0.3; sys_platform == 'darwin'",
  "torch>=2.11.0; sys_platform == 'darwin'",
  "torchvision>=0.26.0; sys_platform == 'darwin'",
]
# Note: mlx-cuda (Linux with CUDA) is experimental and conflicts with vllm.
# Users who need it should install dependencies manually.

[dependency-groups]
dev = ["pytest>=9.0.3"]

[project.scripts]
img2text = "img2text.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/img2text"]

[tool.uv]
# Support Linux x86_64 (vllm, ollama, api) and macOS arm64 (mlx, ollama, api)
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
